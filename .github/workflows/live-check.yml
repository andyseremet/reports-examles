# Automatic test for Property Location Check.
#
# - Every day: tests the live site, and opens (or updates) a GitHub issue if
#   anything fails, for example a government data service changing its address.
# - On every pull request that changes the page: tests the proposed version
#   before it is merged.
# - Any time: run it by hand from the Actions tab ("Run workflow").

name: Live check

on:
  schedule:
    - cron: "17 5 * * *"          # every day at 05:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "tests/**"
      - ".github/workflows/live-check.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: live-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the test browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Serve the proposed version (pull requests only)
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 2

      - name: Diagnose Environment Agency map server (temporary)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node tests/diagnose-ea.mjs

      - name: Run the checks
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'http://localhost:8080/index.html' || 'https://andyseremet.github.io/reports-examles/' }}
        run: node tests/live-check.mjs

      - name: Keep the results, screenshots and sample reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-check-results
          path: test-results/
          retention-days: 14

      - name: Report a failed daily check as an issue
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let summary = "The test did not produce a summary.";
            try { summary = fs.readFileSync("test-results/summary.md", "utf8"); } catch (e) {}
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = "Live check failed";
            const body = `${summary}\n\n---\nFull results, screenshots and sample reports: ${runUrl}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", per_page: 100 });
            const existing = open.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: body.slice(0, 60000) });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body: body.slice(0, 60000) });
            }
