# Automatic test for Property Location Check.
#
# - Every day: tests the live site, and opens (or updates) a GitHub issue if
#   anything fails: "Live check failed" for the app, "Data services down" for a
#   government data service that did not answer (for example after changing its address).
# - On every pull request that changes the page: tests the proposed version
#   before it is merged.
#   Pull requests leave out the 44 outside services that only supply report data
#   (data/data-services.csv), at the owner's request; the report itself still runs,
#   answered from the daily run's recording (recordings.json on the "status" branch),
#   so an outside outage cannot turn a pull request red. Anything not recorded is asked live.
#   They also run the accessibility scan (tests/a11y-check.mjs) as a second job, at the same time.
# - Any time: run it by hand from the Actions tab ("Run workflow"), with the
#   "Check the report data services" box ticked (the default) to test them too.

name: Live check

on:
  schedule:
    - cron: "17 5 * * *"          # every day at 05:17 UTC
  workflow_dispatch:
    inputs:
      data_services:
        description: "Check the report data services (the 44 in data/data-services.csv)"
        type: boolean
        default: true
  pull_request:
    paths:
      - "index.html"
      - "status.html"
      - "glossary.html"
      - "css/**"
      - "js/**"
      - "data/**"
      - "sw.js"
      - "manifest.webmanifest"
      - "tests/**"
      - ".github/workflows/live-check.yml"

permissions:
  contents: read
  issues: write

# The same test library versions as the local test (docs/TESTING.md), so a step that passes there passes here.
# The browser is saved between runs and downloaded again only when PLAYWRIGHT changes.
env:
  PLAYWRIGHT: "1.63.0"
  AXE: "4.14.0"

# A new push to a pull request stops its older check. Daily and manual runs on main are never stopped: each one
# publishes the status page and the recording, so a second run waits for the first to finish.
concurrency:
  group: live-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      data_services: ${{ steps.mode.outputs.data_services }}
    steps:
      # Report data services: checked daily and on manual runs with the box ticked; left out on pull requests.
      - name: Decide whether to check the report data services
        id: mode
        run: echo "data_services=${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.data_services)) && '1' || '0' }}" >> "$GITHUB_OUTPUT"

      - name: Get the code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      # A typing mistake in the app or the tests fails here in a second, before the long check starts.
      - name: Check the code for typing mistakes
        run: |
          node tests/syntax-check.mjs
          for f in tests/*.mjs tests/live/*.mjs; do node --check "$f"; done

      - name: Install the test library
        run: npm install --no-save --no-audit --no-fund playwright@${{ env.PLAYWRIGHT }}

      # The browser is saved between runs (it only changes with the Playwright version above).
      - name: Restore the saved test browser
        id: browser-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ env.PLAYWRIGHT }}-${{ runner.os }}

      - name: Download the test browser (only when it is not saved yet)
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # GitHub's machines usually have everything the browser needs. Installing the extra system files
      # took up to 10 minutes on a slow day, so it only happens if the browser does not start without them.
      - name: Make sure the test browser starts
        run: |
          if node -e "require('playwright').chromium.launch().then(b => b.close())"; then
            echo "The browser starts: no extra system files needed."
          else
            echo "The browser did not start: installing its system files."
            npx playwright install-deps chromium
            node -e "require('playwright').chromium.launch().then(b => b.close())"
          fi

      - name: Serve the proposed version (pull requests only)
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 2

      - name: Run the checks
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'http://localhost:8080/index.html' || 'https://andyseremet.github.io/reports-examles/' }}
          DATA_SERVICES: ${{ steps.mode.outputs.data_services }}
          # Daily and manual runs record the report's outside answers; pull requests replay the latest recording.
          RECORD: ${{ github.event_name != 'pull_request' && '1' || '0' }}
          REPLAY: ${{ github.event_name == 'pull_request' && format('https://raw.githubusercontent.com/{0}/status/recordings.json', github.repository) || '' }}
        run: node tests/live-check.mjs

      # The 10 slowest test steps, on the run's summary page, to see where the time goes without downloading anything.
      - name: List the slowest test steps
        if: always()
        run: |
          [ -f test-results/results.json ] || exit 0
          { echo; echo "## Slowest test steps"; echo; echo '```'
            node tests/digest.mjs test-results/results.json 10 | sed -n '/^Slowest steps/,$p'
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the results, screenshots and sample reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-check-results
          path: test-results/
          retention-days: 14

      # Daily and manual runs keep two issues: "Live check failed" when an app step fails, "Data services down" when an
      # outside service does not answer. Each gets a comment while its part fails and closes after a run in which its
      # part passed ("Data services down" only after a run that checked the data services). Pull requests open none.
      - name: Update the "Live check failed" and "Data services down" issues
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let issues;
            try { issues = JSON.parse(fs.readFileSync("test-results/issues.json", "utf8")); }
            catch (e) { issues = { app: { checked: true, failed: true, body: "The test did not produce a summary (it stopped before the end)." }, services: { checked: false } }; }
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", per_page: 100 });
            for (const [title, part] of [["Live check failed", issues.app], ["Data services down", issues.services]]) {
              const existing = open.find(i => i.title === title && !i.pull_request);
              if (part.failed) {
                const body = `${part.body}\n\n---\nAll checks, screenshots and sample reports: ${runUrl}`.slice(0, 60000);
                if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
                else await github.rest.issues.create({ ...context.repo, title, body });
              } else if (existing && part.checked) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `Passed in this run: ${runUrl}` });
                await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: "closed", state_reason: "completed" });
              }
            }

  # Pull requests only: the accessibility scan (tests/a11y-check.mjs, WCAG 2.2 AA in 4 sizes and colour schemes), on
  # its own machine beside the live check, so the check takes no longer. A data service that is down does not fail it.
  accessibility:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install the test libraries
        run: npm install --no-save --no-audit --no-fund playwright@${{ env.PLAYWRIGHT }} axe-core@${{ env.AXE }}

      - name: Restore the saved test browser
        id: browser-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ env.PLAYWRIGHT }}-${{ runner.os }}

      - name: Download the test browser (only when it is not saved yet)
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Make sure the test browser starts
        run: |
          node -e "require('playwright').chromium.launch().then(b => b.close())" || npx playwright install-deps chromium

      - name: Serve the proposed version
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 2

      - name: Run the accessibility scan
        run: node tests/a11y-check.mjs

  # After a daily (or manual) check of the live site on main, publish the result of each
  # data service for the status page (status.html). It goes to a separate "status" branch,
  # so main stays clean; the page reads it from raw.githubusercontent.com.
  publish-status:
    needs: check
    if: always() && needs.check.result != 'cancelled' && github.ref == 'refs/heads/main' && needs.check.outputs.data_services == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Get today's results
        uses: actions/download-artifact@v7
        with:
          name: live-check-results
          path: test-results/

      - name: Publish to the status branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          prev=none; prevrec=none
          if git fetch --depth 1 origin status 2>/dev/null; then
            git show FETCH_HEAD:status.json > /tmp/previous.json 2>/dev/null && prev=/tmp/previous.json
            git show FETCH_HEAD:recordings.json > /tmp/previous-recordings.json 2>/dev/null && prevrec=/tmp/previous-recordings.json
          fi
          node tests/publish-status.mjs test-results/status.json "$prev" /tmp/status.json
          files="status.json"
          if [ -f test-results/recordings.json ]; then
            node tests/merge-recordings.mjs test-results/recordings.json "$prevrec" /tmp/recordings.json
            files="$files recordings.json"
          elif [ "$prevrec" != none ]; then
            cp "$prevrec" /tmp/recordings.json; files="$files recordings.json"   # keep the last recording
          fi
          git switch --orphan status-new
          git rm -rq --cached . 2>/dev/null || true
          for f in $files; do cp "/tmp/$f" "$f"; done
          git add $files
          git commit -qm "Data service status $(date -u +%Y-%m-%d)"
          git push -f origin HEAD:status
